[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is read in src/edge/clock.rs only; moving to jiff or time is a change of its own" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
