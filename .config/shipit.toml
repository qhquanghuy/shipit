version = 1

[gate]
base = "main"
# A change this size is still reviewable in one sitting; a bigger one is split.
max_files = 60
# Cheap checks first, then the builds and tests, then the metrics, which record and never fail.
# The tests run directly, not through `nix flake check`: Nix prints no log for a check it
# already built (a rerun of the same tree, for example after an amended message), so coverage would
# see no test. The variables of the check and of the build are unset for them: the bats tests run
# shipit in repositories of their own, and an outer SHIPIT_BIN or CARGO_TARGET_DIR makes them test
# another binary.
check = [
  "shipit lint",
  "shipit measure clones",
  "cargo deny check",
  "base=\"$(shipit measure merge-base)\" && gitleaks git --redact --no-banner --log-opts=\"--text $base..HEAD\" .",
  "nix flake check --print-build-logs",
  "shipit coverage -- env -u SHIPIT_MERGE_BASE -u SHIPIT_CHECK -u SHIPIT_BRANCH -u SHIPIT_BIN -u CARGO_TARGET_DIR bash -c 'cargo build --locked && cargo test --locked && bats --tap tests'",
  "shipit metric clone-ratio \"$(shipit measure clone-ratio)\"",
  "shipit metric cognitive-complexity \"$(shipit measure cognitive-complexity)\"",
]

# A slice must not weaken the checks it is judged by, so a change to a file a check reads counts
# as a setup change, which the owner approves by merging and which never comes with code. A path
# that does not exist yet is listed too: the tool reads it as soon as someone adds it.
# deny.toml and its two other places: cargo deny, its ignore list and licence rules.
# .gitleaks.toml, .gitleaksignore: the secret scan, its rules and ignored fingerprints.
# .gitattributes: a second guard; `--text` in the gitleaks line already makes a `binary` line
# harmless, in any folder.
# clippy.toml, .clippy.toml, rustfmt.toml, .rustfmt.toml: the lint and format settings, which the
# flake's clippy and fmt checks read.
# .cargo/config.toml, .cargo/config: cargo reads them for every build, test and lint run (flags, aliases).
# rust-toolchain.toml, rust-toolchain: the action's build reads them to pick the compiler.
# build.rs: it writes the `#[forbid]` lines that keep effects out of pure code.
# flake.nix, flake.lock: the dev shell and every Nix check, so a fake tool or a pinned old one.
# .shellcheckrc: the shellcheck rules of the flake's lint check. shellcheckrc (no dot) is listed for
# a future fileset change; today the flake copies only .shellcheckrc.
# .github: CI, the gate that judges the pull request. Its actionlint settings matter only if a check
# ever runs actionlint inside the repository (today none does).
# Only root files are listed. Nested configs (a rustfmt.toml or .shellcheckrc in a folder) cannot
# all be listed (no globs), and a suppression inside a file (`#[rustfmt::skip]`,
# `# shellcheck disable`, `# gitleaks:allow`) cannot be listed at all; review catches those.
# Cargo.toml holds the lint levels and stays unlisted by the owner's choice: listing it would make
# every dependency change a setup change. It also chooses the build script (`[package] build = ...`),
# so listing build.rs does not close that path while Cargo.toml is unlisted. Cargo.lock is left out
# for the same reason.
# action.yml is unlisted: CI runs this repository's own action (`uses: ./`), built from the pull
# request's source, so for ShipIt itself the recheck trusts code the pull request can change. The
# owner's review is the guard until the recheck runs the base's shipit.
setup_files = [
  "deny.toml",
  ".deny.toml",
  ".cargo/deny.toml",
  ".gitleaks.toml",
  ".gitleaksignore",
  ".gitattributes",
  "clippy.toml",
  ".clippy.toml",
  "rustfmt.toml",
  ".rustfmt.toml",
  ".cargo/config.toml",
  ".cargo/config",
  "rust-toolchain.toml",
  "rust-toolchain",
  "build.rs",
  "flake.nix",
  "flake.lock",
  "shellcheckrc",
  ".shellcheckrc",
  ".github",
]

# Every check runs in the dev shell, which has pmd, lizard, cargo-deny and gitleaks.
[gate.environment]
prefix = ["nix", "develop", "--command"]

[agents]
max_fix_rounds = 2
effort_cap = "high"

[[agents.tiers]]
tier = 1
model = "haiku"

[[agents.tiers]]
tier = 2
model = "sonnet"

[[agents.tiers]]
tier = 3
model = "opus"

[[agents.tiers]]
tier = 4
model = "fable"
stand_in = { model = "opus", effort = "high" }

[agents.roles.scout]
tier = 1
retries = 1
escalate_to = { tier = 2 }

[agents.roles.planner]
tier = 3
effort = "high"

[agents.roles.maker]
tier = 2
effort = "high"

[agents.roles.tester]
tier = 3
effort = "medium"

[agents.roles.reader]
tier = 1

[packs]
skill = "superpowers"
domain = "coding"
model = "claude"

[owner]
max_lines = 30
status_update_max_lines = 10
