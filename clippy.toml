allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true

# Effects live in src/edge/, src/main.rs and build.rs, which `expect` these lints.
disallowed-types = [
    { path = "std::process::Command", reason = "run processes only in src/edge/" },
    { path = "std::fs::File", reason = "touch files only in src/edge/" },
    { path = "std::fs::OpenOptions", reason = "touch files only in src/edge/" },
    { path = "std::fs::DirBuilder", reason = "touch files only in src/edge/" },
    { path = "std::net::TcpStream", reason = "no network" },
    { path = "std::net::TcpListener", reason = "no network" },
    { path = "std::net::UdpSocket", reason = "no network" },
    { path = "std::time::SystemTime", reason = "read the clock only in src/edge/clock.rs" },
    { path = "std::time::Instant", reason = "read the clock only in src/edge/clock.rs" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "touch files only in src/edge/" },
    { path = "std::fs::read_to_string", reason = "touch files only in src/edge/" },
    { path = "std::fs::write", reason = "touch files only in src/edge/" },
    { path = "std::fs::read_dir", reason = "touch files only in src/edge/" },
    { path = "std::fs::copy", reason = "touch files only in src/edge/" },
    { path = "std::fs::create_dir", reason = "touch files only in src/edge/" },
    { path = "std::fs::create_dir_all", reason = "touch files only in src/edge/" },
    { path = "std::fs::remove_file", reason = "touch files only in src/edge/" },
    { path = "std::fs::remove_dir", reason = "touch files only in src/edge/" },
    { path = "std::fs::remove_dir_all", reason = "touch files only in src/edge/" },
    { path = "std::fs::rename", reason = "touch files only in src/edge/" },
    { path = "std::fs::metadata", reason = "touch files only in src/edge/" },
    { path = "std::fs::symlink_metadata", reason = "touch files only in src/edge/" },
    { path = "std::fs::exists", reason = "touch files only in src/edge/" },
    { path = "std::fs::hard_link", reason = "touch files only in src/edge/" },
    { path = "std::fs::soft_link", reason = "touch files only in src/edge/" },
    { path = "std::fs::set_permissions", reason = "touch files only in src/edge/" },
    { path = "std::os::unix::fs::symlink", reason = "touch files only in src/edge/" },
    { path = "std::fs::read_link", reason = "touch files only in src/edge/" },
    { path = "std::fs::canonicalize", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::exists", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::try_exists", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::is_file", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::is_dir", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::is_symlink", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::metadata", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::symlink_metadata", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::read_dir", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::read_link", reason = "touch files only in src/edge/" },
    { path = "std::path::Path::canonicalize", reason = "touch files only in src/edge/" },
    { path = "std::env::args", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::args_os", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::var", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::var_os", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::vars", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::vars_os", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::set_var", reason = "no environment changes" },
    { path = "std::env::remove_var", reason = "no environment changes" },
    { path = "std::env::current_dir", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::set_current_dir", reason = "no environment changes" },
    { path = "std::env::current_exe", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::temp_dir", reason = "read the environment only in src/edge/ or main" },
    { path = "std::env::home_dir", reason = "read the environment only in src/edge/ or main" },
    { path = "std::io::stdout", reason = "only main hands out the streams" },
    { path = "std::io::stderr", reason = "only main hands out the streams" },
    { path = "std::io::stdin", reason = "only main hands out the streams" },
    { path = "std::time::SystemTime::now", reason = "read the clock only in src/edge/clock.rs" },
    { path = "std::time::Instant::now", reason = "read the clock only in src/edge/clock.rs" },
    { path = "chrono::Utc::now", reason = "read the clock only in src/edge/clock.rs" },
    { path = "chrono::Local::now", reason = "read the clock only in src/edge/clock.rs" },
    { path = "std::process::Command::new", reason = "run processes only in src/edge/" },
    { path = "std::process::exit", reason = "only main exits" },
]
