- repo: local
  hooks:
    - id: shipit
      name: shipit pre-push
      stages: [pre-push]
      language: system
      pass_filenames: false
      always_run: true
      entry: sh -c 'if [ -n "$PRE_COMMIT_TO_REF" ] && command -v shipit >/dev/null 2>&1; then printf "%s %s %s %s\n" "$PRE_COMMIT_LOCAL_BRANCH" "$PRE_COMMIT_TO_REF" "$PRE_COMMIT_REMOTE_BRANCH" "$PRE_COMMIT_FROM_REF" | shipit pre-push "$PRE_COMMIT_REMOTE_NAME" "$PRE_COMMIT_REMOTE_URL"; fi'
