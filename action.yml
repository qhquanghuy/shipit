name: ShipIt recheck
description: Rechecks a pull request with ShipIt. The full rules apply on slice/* branches; on any other branch only the base branch's check commands run.

inputs:
  base:
    description: The branch the change is compared with.
    default: ${{ github.base_ref || github.ref_name }}
  branch:
    description: The branch the change is on (the pull request's head branch, or the pushed branch).
    default: ${{ github.head_ref || github.ref_name }}

runs:
  using: composite
  steps:
    - name: Fetch the history ShipIt compares with
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --quiet --unshallow origin
        fi
        git fetch --no-tags --quiet origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

    # The runner's own cargo, so no other tool is installed. A newer compiler's new warning must
    # not break every project's recheck, and the build stays outside the work tree so that
    # `shipit check` sees a clean tree.
    # It runs in the action's own folder with the stable toolchain, so the checkout's cargo config
    # and rust-toolchain file cannot change how the judge is built. With `uses: ./` the action's
    # folder is the checkout, so there the pull request's own settings apply, which is wanted.
    - name: Build ShipIt
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: stable
        RUSTFLAGS: --cap-lints=warn
        CARGO_PROFILE_RELEASE_LTO: "off"
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        CARGO_TARGET_DIR: ${{ runner.temp }}/shipit
      run: |
        cd "$GITHUB_ACTION_PATH"
        cargo build --release --locked --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
        echo "$RUNNER_TEMP/shipit/release" >> "$GITHUB_PATH"

    # CI checks out a detached commit, so the branch name comes from the event.
    - name: Recheck
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        BRANCH: ${{ inputs.branch }}
        SHIPIT_BRANCH: ${{ inputs.branch }}
      run: |
        "$RUNNER_TEMP/shipit/release/shipit" recheck --base "$BASE" --branch "$BRANCH" --summary "$GITHUB_STEP_SUMMARY"
