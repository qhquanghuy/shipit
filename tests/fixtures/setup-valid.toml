version = 1

[gate]
base = "main"
max_files = 60
check = ["nix flake check --print-build-logs"]

[gate.environment]
prefix = []

[agents]
max_fix_rounds = 2
effort_cap = "high"

[[agents.tiers]]
tier = 1
model = "haiku"

[[agents.tiers]]
tier = 2
model = "sonnet"

[[agents.tiers]]
tier = 3
model = "opus"

[[agents.tiers]]
tier = 4
model = "fable"
stand_in = { model = "opus", effort = "high" }

[agents.roles.scout]
tier = 1
retries = 1
escalate_to = { tier = 2 }

[agents.roles.planner]
tier = 3
effort = "high"

[agents.roles.maker]
tier = 2
effort = "high"

[agents.roles.tester]
tier = 3
effort = "medium"

[agents.roles.reader]
tier = 1

[packs]
skill = "superpowers"
domain = "coding"
model = "claude"

[owner]
max_lines = 30
status_update_max_lines = 10
